[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "0.1.0"
requires-python = ">=3.15"
description = "Local-first moderation MLOps platform"
dependencies = [
    "boto3==1.43.118",
    "celery==5.6.3",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "redis==8.1.0",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
