x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://visionguard:local-dev-only@postgres:5432/visionguard
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://objectstore:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-visionguard-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-local-dev-only}
  S3_BUCKET: ${S3_BUCKET:-visionguard}
  S3_REGION: ${S3_REGION:-us-east-1}
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: visionguard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionguard -d visionguard"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  storage-config:
    image: visionguard-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    user: "0:0"
    environment: *app-environment
    command: ["python", "/app/scripts/init_storage_config.py"]
    volumes:
      - storage-config:/config
    restart: "no"

  objectstore:
    image: chrislusf/seaweedfs:3.85
    command: ["server", "-dir=/data", "-ip=objectstore", "-ip.bind=0.0.0.0", "-volume.max=5", "-master.volumeSizeLimitMB=100", "-filer", "-s3", "-s3.port=9000", "-s3.config=/config/seaweedfs-s3.json"]
    depends_on:
      storage-config:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - objectstore-data:/data
      - storage-config:/config:ro
      - ./docker/filer.toml:/etc/seaweedfs/filer.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8888/"]
      interval: 5s
      timeout: 3s
      retries: 12

  bucket-init:
    image: visionguard-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      objectstore:
        condition: service_healthy
    environment: *app-environment
    command: ["python", "/app/scripts/init_bucket.py"]
    restart: "no"

  backend:
    image: visionguard-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10).close()"]
      interval: 10s
      timeout: 12s
      start_period: 20s
      retries: 6

  worker:
    image: visionguard-backend:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["celery", "-A", "workers.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=worker@%h"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app:app inspect ping --destination worker@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 6

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  storage-config:
